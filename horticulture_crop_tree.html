
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
.app { max-width: 420px; margin: 0 auto; background: #f0f4f0; min-height: 700px; border-radius: 16px; overflow: hidden; border: 1px solid #d0ddd0; display: flex; flex-direction: column; }
.topbar { background: #1a4731; color: #fff; padding: 13px 16px; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.breadcrumb { font-size: 10px; color: #86c9a0; margin-top: 3px; font-weight: 400; }
.tree-panel { background: #fff; max-height: 270px; overflow-y: auto; border-bottom: 2px solid #c8ddc8; flex-shrink: 0; }
.tree-panel::-webkit-scrollbar { width: 3px; }
.tree-panel::-webkit-scrollbar-thumb { background: #b0c8b0; border-radius: 4px; }

.ti { display: flex; align-items: center; cursor: pointer; border-bottom: 0.5px solid #f0f5f0; user-select: none; transition: background 0.12s; }
.ti:active { background: #e8f5e8; }
.ti.n1 { padding: 11px 12px; font-size: 13.5px; font-weight: 700; color: #1a4731; background: #f4faf4; }
.ti.n2 { padding: 10px 12px 10px 20px; font-size: 13px; font-weight: 600; color: #2d7a4f; }
.ti.n3 { padding: 9px 12px 9px 34px; font-size: 12.5px; font-weight: 500; color: #444; }
.ti.n4 { padding: 8px 12px 8px 48px; font-size: 12px; color: #555; }
.ti.n5 { padding: 8px 12px 8px 62px; font-size: 12px; color: #666; }
.ti.n5.active { color: #1a7a3f; font-weight: 700; background: #e2f5e8; border-left: 3px solid #2d9b5a; }

.ch { font-size: 9px; color: #aaa; margin-right: 7px; transition: transform 0.18s; display: inline-block; flex-shrink: 0; }
.ch.open { transform: rotate(90deg); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #ccc; margin-right: 9px; flex-shrink: 0; }
.dot.active { background: #2d9b5a; }

.content { flex: 1; display: none; flex-direction: column; overflow: hidden; }
.content.show { display: flex; }

.heading-bar { background: #1a4731; color: #fff; padding: 11px 16px; font-size: 13.5px; font-weight: 700; flex-shrink: 0; }
.sub-heading { padding: 11px 16px; font-size: 12.5px; color: #444; background: #f4faf4; border-bottom: 1px solid #d8ead8; line-height: 1.6; flex-shrink: 0; }

.tabs { display: flex; border-bottom: 2px solid #d8ead8; background: #fff; flex-shrink: 0; }
.tab { flex: 1; padding: 10px 4px; text-align: center; font-size: 11.5px; font-weight: 500; color: #888; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; }
.tab.active { color: #2d9b5a; border-bottom: 2px solid #2d9b5a; }

.tab-scroll { flex: 1; overflow-y: auto; }
.tab-content { display: none; }
.tab-content.active { display: block; }

.writeup-area { padding: 14px 16px; }
.writeup-label { font-size: 11px; color: #888; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
.writeup-area textarea { width: 100%; min-height: 110px; border: 1px solid #c8ddc8; border-radius: 10px; padding: 12px; font-size: 13px; color: #333; resize: none; outline: none; line-height: 1.6; background: #fafffe; }
.writeup-area textarea:focus { border-color: #2d9b5a; box-shadow: 0 0 0 2px #d4f0df; }
.save-btn { margin: 0 16px 14px; width: calc(100% - 32px); padding: 11px; background: #1a7a3f; color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; }
.save-btn:active { background: #145f30; }

.media-section { padding: 14px 16px; }
.media-label { font-size: 11px; color: #888; margin-bottom: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; }
.media-grid { display: flex; gap: 10px; }
.media-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; background: #f0faf2; border: 1.5px dashed #2d9b5a; border-radius: 12px; padding: 14px 8px; cursor: pointer; }
.media-btn:active { background: #d4f0df; }
.media-btn svg { width: 22px; height: 22px; }
.media-btn span { font-size: 11.5px; color: #2d9b5a; font-weight: 600; }

.thumbs { display: flex; gap: 10px; flex-wrap: wrap; padding: 14px 16px 4px; }
.thumb { width: 72px; height: 72px; border-radius: 10px; background: #e2f5e8; border: 1px solid #b0dbc0; display: flex; align-items: center; justify-content: center; font-size: 28px; position: relative; cursor: pointer; }
.thumb .del { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; background: #e24b4a; color: #fff; border-radius: 50%; font-size: 11px; display: flex; align-items: center; justify-content: center; font-weight: 700; }
.empty-media { padding: 24px 16px; text-align: center; color: #bbb; font-size: 13px; }

.fn-box { padding: 14px 16px; }
.fn-item { background: #f4faf4; border: 1px solid #c8ddc8; border-radius: 10px; padding: 12px; margin-bottom: 10px; font-size: 12.5px; color: #444; line-height: 1.55; }
.fn-tag { display: inline-block; background: #d4f0df; color: #1a5c35; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; margin-bottom: 6px; }
.fn-add { display: flex; align-items: center; gap: 6px; color: #2d9b5a; font-size: 13.5px; font-weight: 700; cursor: pointer; padding: 6px 0; }

.nav-row { display: flex; gap: 10px; padding: 12px 16px; background: #f4faf4; border-top: 1px solid #c8ddc8; flex-shrink: 0; }
.nav-btn { flex: 1; padding: 11px; border-radius: 10px; border: none; font-size: 13px; font-weight: 700; cursor: pointer; }
.nav-btn.prev { background: #e2f5e8; color: #1a7a3f; }
.nav-btn.prev:active { background: #c8ebd4; }
.nav-btn.next { background: #1a7a3f; color: #fff; }
.nav-btn.next:active { background: #145f30; }
.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }

.empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #aaa; font-size: 13.5px; text-align: center; line-height: 1.8; padding: 30px; }
.empty-icon { font-size: 52px; margin-bottom: 14px; }
</style>

<script>

      { id:'f1s3', name:'Harvesting', children:[

    { id:'f2', name:'Banana', children:[
      { id:'f2s1', name:'Cultivation', children:[

        { id:'f2s1i2', name:'Irrigation & Fertigation', desc:'Banana requires 1800–2000 mm water annually. Use drip irrigation with 100% RDF through fertigation. Apply N:P:K @ 200:60:300 g/plant/year.', emoji:'💧', notes:['Drip saves 40% water over flood irrigation.','Split N fertilizer into 4–5 doses.'] }

    { id:'v1', name:'Tomato', children:[
      { id:'v1s1', name:'Nursery Management', children:[

        { id:'v1s1i2', name:'Transplanting', desc:'Transplant 25–30 day old seedlings on ridges at 60×45 cm spacing. Drench soil with Metalaxyl 0.2% before transplanting to control Pythium.', emoji:'🌱', notes:['Avoid transplanting in afternoon heat.','Apply Azospirillum 2 kg/ha as soil application.'] }
      ]},

        { id:'v1s2i1', name:'Fruit Borer', desc:'Helicoverpa armigera bores into fruits causing up to 70% loss. Use pheromone traps @ 5/ha to monitor adult moths. Spray Spinosad 0.01% at egg hatching.', emoji:'🐛', notes:['Set pheromone traps at knee height.','Collect and destroy damaged fruits regularly.'] },

];

var openNodes = { cat1: true, f1: true, f1s1: true };
var selectedId = null;
var allLeafItems = [];
var currentIdx = 0;

function collectLeaves() {
  allLeafItems = [];
  data.forEach(function(cat) {
    if (!openNodes[cat.id]) return;
    cat.children.forEach(function(crop) {
      if (!openNodes[crop.id]) return;
      crop.children.forEach(function(sec) {
        if (!openNodes[sec.id]) return;
        sec.children.forEach(function(item) { allLeafItems.push(item); });
      });
    });
  });
}

function buildTree() {
  collectLeaves();
  var html = '';
  data.forEach(function(cat) {
    var o = openNodes[cat.id];
    html += row('n1', cat.id, cat.name, o, true);
    if (o) {
      cat.children.forEach(function(crop) {
        var o2 = openNodes[crop.id];
        html += row('n2', crop.id, '🌿 ' + crop.name, o2, true);
        if (o2) {
          crop.children.forEach(function(sec) {
            var o3 = openNodes[sec.id];
            html += row('n3', sec.id, '📂 ' + sec.name, o3, true);
            if (o3) {
              sec.children.forEach(function(item) {
                var act = selectedId === item.id;
                html += '<div class="ti n5' + (act ? ' active' : '') + '" onclick="selectItem(\'' + item.id + '\')">'
                  + '<span class="dot' + (act ? ' active' : '') + '"></span>' + item.emoji + ' ' + item.name + '</div>';
              });
            }
          });
        }
      });
    }
  });
  document.getElementById('tree').innerHTML = html;
}

function row(cls, id, label, isOpen, hasChildren) {
  var ch = hasChildren ? '<span class="ch' + (isOpen ? ' open' : '') + '">▶</span>' : '<span style="width:16px;display:inline-block"></span>';
  return '<div class="ti ' + cls + '" onclick="toggle(\'' + id + '\')">' + ch + label + '</div>';
}

function toggle(id) { openNodes[id] = !openNodes[id]; buildTree(); }

function findItem(id) {
  for (var c of data) for (var cr of c.children) for (var s of cr.children) for (var it of s.children)
    if (it.id === id) return it;
  return null;
}

function getBreadcrumb(id) {
  for (var c of data) for (var cr of c.children) for (var s of cr.children) for (var it of s.children)
    if (it.id === id) return cr.name + ' › ' + s.name;
  return '';
}

function selectItem(id) {
  selectedId = id;
  buildTree();
  var item = findItem(id);
  if (!item) return;
  document.getElementById('itemHeading').textContent = item.emoji + '  ' + item.name;
  document.getElementById('itemDesc').textContent = item.desc;
  document.getElementById('bc').textContent = getBreadcrumb(id);
  document.getElementById('content').className = 'content show';
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('writeupText').value = '';

  var tc = document.getElementById('thumbsContainer');
  tc.innerHTML = item.emoji
    ? '<div class="thumb">' + item.emoji + '<div class="del" onclick="this.parentElement.remove()">×</div></div>'
    : '';

  var fnBox = document.getElementById('fnBox');
  fnBox.innerHTML = '';
  (item.notes || []).forEach(function(n) {
    fnBox.innerHTML += '<div class="fn-item"><span class="fn-tag">NOTE</span><br>' + n + '</div>';
  });
  fnBox.innerHTML += '<div class="fn-add" onclick="alert(\'Add foot note\')">＋ Add Foot Note</div>';

  switchTab('writeup', 0);
  currentIdx = allLeafItems.findIndex(function(i) { return i.id === id; });
  document.getElementById('prevBtn').disabled = currentIdx <= 0;
  document.getElementById('nextBtn').disabled = currentIdx >= allLeafItems.length - 1;
}

function switchTab(name, idx) {
  document.querySelectorAll('.tab-content').forEach(function(t) { t.classList.remove('active'); });
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  document.getElementById('tab-' + name).classList.add('active');
  document.querySelectorAll('.tab')[idx].classList.add('active');
}

function navigate(dir) {
  var next = currentIdx + dir;
  collectLeaves();
  if (next < 0 || next >= allLeafItems.length) return;
  selectItem(allLeafItems[next].id);
}

buildTree();
</script>
